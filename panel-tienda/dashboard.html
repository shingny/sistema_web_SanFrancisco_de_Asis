<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Gestión de pedidos</title>
  <link rel="stylesheet" href="static/css/dashboard.css" />
</head>
<body>
  <header class="barra-superior">
    <img class="logo" src="static/img/logo.png" alt="Logo" />
    <div class="titulo">
      Panel de tienda
      <span>San Francisco de Asís</span>
    </div>
    <div class="seleccion-tienda">
      <label for="select-tienda">Tienda:</label>
      <select id="select-tienda">
        <option value="">Cargando tiendas...</option>
      </select>
      <button id="btn-cerrar" class="btn-cerrar">Cerrar sesión</button>
    </div>
  </header>

  <div id="toast-area" class="toast-area"></div>

  <main class="panel-contenido">
    <div id="mensaje-error" class="mensaje error"></div>

    <!-- ======================= PEDIDOS ========================== -->
    <h2 class="titulo-seccion">Pedidos <span class="etiqueta">Microservicio 1</span></h2>
    <section id="kanban-pedidos" class="kanban"></section>

    <!-- ===================== SEPARADO / RESERVAS ================= -->
    <h2 class="titulo-seccion">Separado de tortas <span class="etiqueta">Microservicio 2</span></h2>
    <section id="kanban-reservas" class="kanban"></section>

    <!-- ================= GESTIÓN DE IMÁGENES ==================== -->
    <h2 class="titulo-seccion">Catálogo · Imágenes <span class="etiqueta">Cloudinary</span></h2>
    <section class="panel-imagenes">
      <div class="tarjeta-imagen">
        <label for="select-producto">Producto</label>
        <select id="select-producto">
          <option value="">Cargando productos...</option>
        </select>
      </div>

      <div class="tarjeta-imagen preview">
        <div class="preview-titulo">Imagen actual</div>
        <div id="preview-imagen" class="preview-vacio">Selecciona un producto para ver su imagen.</div>
      </div>

      <div class="tarjeta-imagen accion">
        <label for="input-imagen">Nueva imagen (JPG / PNG / WebP)</label>
        <input type="file" id="input-imagen" accept="image/png,image/jpeg,image/webp" />
        <button id="btn-subir" class="btn btn-primario" disabled>Subir imagen a Cloudinary</button>
        <button id="btn-quitar" class="btn btn-secundario" disabled>Quitar imagen</button>
      </div>
    </section>
  </main>

  <script src="static/js/config.js"></script>
  <script src="static/js/dashboard.js"></script>
</body>
</html>
