<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo y personalización</title>
  <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body>
  <header class="header">
    <button id="btn-volver" class="btn-volver" aria-label="Volver a seleccionar tienda">←</button>
    <img class="logo" src="static/img/logo.png" alt="Logo San Francisco de Asís" />
    <div class="marca">
      <h1 id="marca-titulo">Catálogo</h1>
      <p id="tienda-actual" class="tienda-actual"></p>
    </div>
  </header>

  <main class="contenido">
    <div id="mensaje-error" class="mensaje error"></div>
    <div id="cargando" class="cargando">Cargando catálogo...</div>

    <div class="tabs">
      <button id="tab-tortas" class="tab activo" data-tipo="torta">Tortas</button>
      <button id="tab-bocaditos" class="tab" data-tipo="bocadito">Bocaditos</button>
    </div>

    <section id="productos-grid" class="grid-productos"></section>

    <div id="carrito-vacio" class="vacio vacio-carrito">Aún no has agregado productos a tu pedido.</div>

    <!-- Barra flotante de carrito -->
    <div id="barra-carrito" class="barra-carrito" style="display: none;">
      <div class="info">Tu pedido: <strong id="carrito-resumen">0 productos</strong></div>
      <button id="btn-ir-checkout" class="btn-carrito">Ver pedido ›</button>
    </div>
  </main>

  <footer class="pie">
    <strong>San Francisco de Asís</strong> · Torta de cumpleaños, eventos y más · Huancayo - Perú
  </footer>

  <script src="static/js/config.js"></script>
  <script src="static/js/catalogo.js"></script>
</body>
</html>
